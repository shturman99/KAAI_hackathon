id: fixedpen
description: Penalty held fixed rather than tuned. Used for the transform-stability
  measurements, where the question is how much a fitted readout moves under rotation,
  not how accurate it is -- so the inner 12-point penalty grid (60 solves per fit)
  buys nothing and costs ~30x.
decisions:
  embedding_preprocessing: standardize
  eval_split: kfold_5
  real_quality_cuts: standard
  target_transform: log_ssfr
  probe_model: ridge
  probe_regularization: fixed
  morphology_label_form: threshold_median
  sim_quality_cuts: pathology_and_encl
analyses:
  probes:
    universe: baseline
  manifold:
    universe: baseline
  domain_gap:
    universe: baseline
